# Sample workflow for building and deploying a Hugo site to GitHub Pages
name: Deploy Hugo site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches:
      - main

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

# Default to bash
defaults:
  run:
    shell: bash

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.165.0
      HUGO_GH_TOKEN: ${{ secrets.HUGO_GH_TOKEN }}
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb
      - name: Install Dart Sass
        run: sudo snap install dart-sass
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Install Node.js dependencies
        run: "[[ -f package-lock.json || -f npm-shrinkwrap.json ]] && npm ci || true"
      - name: Build with Hugo
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
          TZ: UTC
        run: |
          hugo \
            --gc \
            --minify \
            --baseURL "https://karnak.weasis.org/"
      # data/versions.toml can point at other documentation lines: the previous
      # major branch while it is still maintained, and older releases once they
      # are frozen. Each entry that declares both a `branch` and a `url` is
      # rebuilt here from that branch — with its own theme commit — into
      # public/<url>/ on every deploy. Nothing is written back to the
      # repository, so no built HTML is ever committed. The list is normally
      # short or empty; each entry costs a worktree checkout plus a sub-second
      # Hugo build.
      - name: Build other documentation lines
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
          TZ: UTC
          BASE_URL: https://karnak.weasis.org
          LINE_LIST: ${{ runner.temp }}/doclines.txt
        run: |
          set -euo pipefail
          python3 - <<'PY' > "$LINE_LIST"
          import sys, tomllib
          with open("data/versions.toml", "rb") as handle:
              data = tomllib.load(handle)
          for entry in data.get("version", []):
              state = entry.get("state")
              branch, url = entry.get("branch"), entry.get("url")
              if state not in ("maintained", "archived") or not (branch and url):
                  continue
              path = url.strip("/")
              if not path or ".." in path.split("/"):
                  sys.exit(f"invalid url {url!r} for version {entry.get('id')!r}")
              print(entry["id"], state, branch, path)
          PY
          while read -r id state branch path; do
            [ -z "$id" ] && continue
            echo "::group::Karnak $id documentation ($state, branch $branch) -> /$path/"
            work="${{ runner.temp }}/docline-$id"
            git fetch --no-tags origin "+refs/heads/$branch:refs/remotes/origin/$branch"
            git worktree add --detach "$work" "refs/remotes/origin/$branch"
            git -C "$work" submodule update --init --recursive
            HUGO_PARAMS_DOCLINE="$id" HUGO_PARAMS_DOCLINESTATE="$state" hugo \
              --source "$work" \
              --gc \
              --minify \
              --baseURL "$BASE_URL/$path/" \
              --destination "$GITHUB_WORKSPACE/public/$path"
            git worktree remove --force "$work"
            echo "::endgroup::"
          done < "$LINE_LIST"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4