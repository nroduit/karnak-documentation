<!-- Partial intended to be overwritten to add custom headers, like CSS or any other info
<style>
   /* Custom css */
</style>
-->

<style>
    /* Configuration tables (marked with {class="cfg-table"} in the Markdown):
       keep the Default column from being stretched by long unbreakable values
       such as the DICOM filepath pattern. */
    .cfg-table { table-layout: fixed; width: 100%; }
    .cfg-table th:nth-child(1), .cfg-table td:nth-child(1) { width: 30%; }
    .cfg-table th:nth-child(2), .cfg-table td:nth-child(2) { width: 20%; }
    .cfg-table th:nth-child(3), .cfg-table td:nth-child(3) { width: 50%; }
    .cfg-table td code { overflow-wrap: anywhere; }
</style>

{{- if isset .Params "canonical" -}}
<link rel="canonical" href="{{ .Params.baseURL }}" />
{{- else if site.Params.docline -}}
{{/* another documentation line: keep it out of the index so it does not compete
     with the current line for the same queries, and credit the live page */}}
<meta name="robots" content="noindex, follow" />
<link rel="canonical" href="{{ partial "_karnak/liveURL.gotmpl" . }}" />
{{- else -}}
<link rel="canonical" href="{{ .Permalink }}" />
{{- end }}

<!-- Google Consent Mode with minimal data collection that minimize the need for user consent -->
<script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('consent', 'default', {
        'ad_storage': 'denied',
    });
</script>
<!-- Global site tag (gtag.js) - Google Analytics -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-FDMQXRNXGS"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-FDMQXRNXGS', {
    'anonymize_ip': true,
    'allow_ad_personalization_signals': false,
    'allow_google_signals': false
  });
</script>


<!-- Lightbox see https://hugocodex.org/add-ons/lightbox/ -->
<script defer type="text/javascript" src="/js/lightbox.js"></script>
<link rel="stylesheet" href="/css/lightbox.css">

<!-- Documentation version filter, see data/versions.toml -->
{{ partial "docversion-head.html" . }}
<script defer type="text/javascript" src="/js/doc-version.js"></script>
