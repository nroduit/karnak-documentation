# this is a required setting for this theme to appear on https://themes.gohugo.io/
# change this to a value appropriate for you
baseurl = "https://karnak.weasis.org/"
# as the official Hugo documentation recommends, we turn this off for this
# showcase; this allows the published site to be served by both http and https
canonifyURLs = true
# required for official documentation served from subfolder
relativeURLs = false

disableHugoGeneratorInject = true

# the directory where Hugo reads the themes from; this is specific to your
# installation and most certainly needs be deleted or changed
#themesdir = "../.."
# yeah, well, obviously a mandatory setting for your site, if you want to
# use this theme ;-)
theme = "hugo-theme-relearn"

# the main language of this site; also an automatic pirrrate translation is
# available in this showcase
locale = "en"
defaultContentLanguage = "en"
defaultContentLanguageInSubdir= true

# Shown after the page title in every <title> tag, so it is kept to the product
# name alone: "Install Karnak with Docker Compose | Karnak" leaves room for the
# distinctive part of the title in a search result, where roughly 60 characters
# are displayed. The full name lives in og:site_name and in the JSON-LD.
title = "Karnak"

# Robots.txt for web crawlers
enableRobotsTXT = true

# Every page gets a `lastmod` from its last commit, which feeds <lastmod> in the
# sitemap and dateModified in the JSON-LD. Without this the sitemap carries no
# date at all and a crawler has no way to tell what changed.
enableGitInfo = true

[frontmatter]
  # `updated:` first, so an editorial claim ("this page changed in a way that
  # matters") beats the commit date of a typo fix; :git is the fallback.
  lastmod = ['updated', 'lastmod', ':git', 'date', 'publishDate']

[minify]
disableCSS = false
disableHTML = true
disableJS = false
disableJSON = false
disableSVG = false
disableXML = false
minifyOutput = false
[minify.tdewolff]
[minify.tdewolff.css]
version = 2
precision = 0
[minify.tdewolff.html]
keepSpecialComments = true
keepDefaultAttrVals = true
keepDocumentTags = true
keepEndTags = true
keepQuotes = false
keepWhitespace = true
[minify.tdewolff.js]
keepVarNames = false
noNullishOperator = false
precision = 0
version = 0
[minify.tdewolff.json]
keepNumbers = false
precision = 0
[minify.tdewolff.svg]
keepComments = false
precision = 0
[minify.tdewolff.xml]
keepWhitespace = false

# settings specific to this theme's features; choose to your likings and
# consult this documentation for explanation
[params]
  editURL = "https://github.com/nroduit/karnak-documentation/edit/main/content/"
  logo = { src = '/images/logo.svg' }
  # Default social-card image (og:image / twitter:image) for pages that declare no `images` of their own.
  # 1200x630 @2x card rendered by social-cards/build.sh; feature pages set their own card in front matter.
  images = ['/images/social/karnak.png']
  linkTitle = ""
  # Author of the site, will be used in meta information
  author.name = "Karnak Team"
  showVisitedLinks = true
  externalLinkTarget = '_blank'
  disableBreadcrumb = false
  disableTOC = false
  disableGeneratorVersion = true
  disableNextPrev = false
  disableLandingPageButton = true
  # The page footer would otherwise show the last commit's git author and
  # date. Neither says anything useful to a reader of the documentation, and
  # the author line publishes a committer's name and email address on every
  # page. The dates that matter are still emitted: `lastmod` continues to
  # feed <lastmod> in the sitemap and dateModified in the JSON-LD.
  hideAuthorName = true
  hideAuthorEmail = true
  hideAuthorDate = true
  titleSeparator = "|"
  themeVariant = [ "relearn-dark", "relearn-light" ]
  themeVariantAuto = [ "relearn-light", "relearn-dark" ]
  disableSeoHiddenPages = true
  # Keep internal links, breadcrumbs and og:url free of an `index.html` suffix:
  # otherwise they disagree with the canonical, which is the bare directory URL.
  disableExplicitIndexURLs = true
  # this is for the stylesheet genertor to allow for interactivity in mermaid
  # graphs; you usually will not need it and you should remove this for
  # security reasons
  mermaidInitialize = "{ \"securityLevel\": \"loose\" }"
  disableInlineCopyToClipBoard = true
  # Sidebar: insert the documentation version selector (layouts/partials/sidebar/
  # element/docversion.html, fed by data/versions.toml) below the search box.
  # Reconfiguring a sidebar area resets its defaults, so the theme's own entries
  # for that area are repeated here; the theme's `versionswitcher` is dropped as
  # it drives multi-site versioning, which this site does not use.
  sidebarheadermenus = [
    { type = 'divider' },
    { type = 'custom', identifier = 'headercontrols', elements = [ { type = 'docversion' } ] },
    { type = 'divider' }
  ]

  # Broken internal links (relref/ref) surface as build warnings instead of being silently emitted.
  [params.link]
    errorlevel = 'warning'

[outputs]
  # add JSON to the home page to support lunr search; This is a mandatory setting
  # for the search functionality
  home = ['html', 'rss', 'print', 'llms', 'llmsfull']
  section = ['html', 'rss', 'print']
  page = ['html', 'rss', 'print']

# A per-language `outputs` table REPLACES this one instead of merging into it,
# so `section` and `page` are repeated below; dropping them would silently take
# the print and RSS renderings away from every English page.
[Languages.en.outputs]
  home = ['html', 'rss', 'print', 'llms', 'llmsfull']
  section = ['html', 'rss', 'print']
  page = ['html', 'rss', 'print']

[Languages.fr.outputs]
  home = ['html', 'rss', 'print']
  section = ['html', 'rss', 'print']
  page = ['html', 'rss', 'print']

# The two files land at the site root rather than under /en/ through the `../`
# in baseName; they are plain text, one per language would make no sense.
[outputFormats.LLMS]
  mediaType = "text/plain"
  baseName = "../llms"
  isPlainText = true
  notAlternative = true

[outputFormats.LLMSFULL]
  mediaType = "text/plain"
  baseName = "../llms-full"
  isPlainText = true
  notAlternative = true

[markup]
  [markup.highlight]
    # if `guessSyntax = true`, there will be no unstyled code even if no language
    # was given BUT mermaid code fences will not work anymore! So this is a mandatory
    # setting for your site
    guessSyntax = false

    # here in this showcase we use our own modified chroma syntax highlightning style
    # which is imported in theme-relearn-light.css / theme-relearn-dark.css;
    # if you want to use a predefined style instead:
    # - remove the following `noClasses`
    # - set the following `style` to a predefined style name
    # - remove the `@import` of the self-defined chroma stylesheet from your CSS files
    #   (here eg.: theme-relearn-light.css / theme-relearn-dark.css)
    noClasses = false
    # style = "tango"

    [markup.goldmark.renderer]
    # activated for this showcase to use HTML and JavaScript; decide on your own needs;
    # if in doubt, remove this line
    unsafe = true

  [markup.goldmark.parser.attribute]
    # allow `{ ... }` attribute lists on block elements (headings, images, tables)
    block = true


[Languages]
[Languages.en]
title = "Karnak"
weight = 1
label = "English"

[Languages.fr]
title = "Documentation"
# No French content exists yet (`content/` holds only `.en.md`), so the French
# tree is a shell of empty section pages: served `noindex` by
# layouts/partials/custom-header.html, and with no sitemap of its own — an empty
# sitemap is only something for a search engine to fetch and discard. Drop this
# block on the day a `.fr.md` page exists.
# `content/` holds only `.en.md`, so this tree is a shell of empty section
# pages. They are served `noindex` (layouts/partials/custom-header.html) and
# excluded from the sitemap (layouts/_default/sitemap.xml), which is why
# /fr/sitemap.xml comes out with zero URLs. Hugo 0.165 offers no supported way
# to suppress that empty file; it is valid and costs a crawler one fetch.
# Remove the language, or add French content, to be rid of it.
weight = 2
label = "Français"
